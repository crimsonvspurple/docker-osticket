services:

  osticket-app:
    build: ..
    image: ghcr.io/crimsonvspurple/docker-osticket:1.18.4
    container_name: osticket-app
    ports:
      - "8080:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.osticket-app.rule=Host(`osticket.example.com`)
      - traefik.http.services.osticket-app.loadbalancer.server.port=80
    volumes:
      - ./data/:/www/osticket
      - ./logs/:/www/logs
    environment:
      - TIMEZONE=America/Vancouver
      - CONTAINER_NAME=osticket-app

      - CRON_INTERVAL=10

      - DB_HOST=osticket-db
      - DB_NAME=osticket
      - DB_USER=osticket
      - DB_PASS=password

      - SMTP_HOST=localhost
      - SMTP_PORT=25
      - SMTP_FROM=osticket@example.com
      - SMTP_TLS=0
      - SMTP_USER=osticket@example.com
      - SMTP_PASS=password

      - INSTALL_SECRET=somerandomlargecharacterstring
      - INSTALL_EMAIL=osticket@example.com
      - INSTALL_NAME=OSTicket Helpdesk

      - ADMIN_FIRSTNAME=Admin
      - ADMIN_LASTNAME=User
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_USER=ostadmin
      - ADMIN_PASS=Password123
    networks:
      - services
    depends_on:
      - osticket-db
    restart: always

  osticket-db:
    image: mariadb:11.4
    container_name: osticket-db
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - TZ=America/Vancouver
      - MARIADB_ROOT_PASSWORD=securepassword
      - MARIADB_DATABASE=osticket
      - MARIADB_USER=osticket
      - MARIADB_PASSWORD=password
    networks:
      - services
    restart: always

networks:
  services:
